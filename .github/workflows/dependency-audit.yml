name: Dependency audit

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the audit tool from wheels
        run: |
          python -m pip install --only-binary=:all: pip-audit==2.10.1
      - name: Audit every pinned runtime and development dependency
        run: python -m pip_audit --strict --no-deps --disable-pip -r backend/constraints.txt --format json --output "$RUNNER_TEMP/python-audit.json"
      - name: Store the raw Python report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dependency-audit
          path: ${{ runner.temp }}/python-audit.json
          if-no-files-found: error

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Use the declared npm version
        # Bootstrap only the exact declared package manager, with scripts disabled.
        run: npm install --global npm@11.12.1 --ignore-scripts # zizmor: ignore[adhoc-packages]
      - name: Install the frozen frontend with scripts disabled
        run: npm ci --ignore-scripts --no-audit
      - name: Audit all frontend dependencies
        run: npm audit --json > "$RUNNER_TEMP/javascript-audit.json"
      - name: Store the raw JavaScript report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javascript-dependency-audit
          path: ${{ runner.temp }}/javascript-audit.json
          if-no-files-found: error
